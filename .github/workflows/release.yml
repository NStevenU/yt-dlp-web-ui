name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (optional if triggered on tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build Multiarch Binaries
        run: |
          mkdir -p release-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o release-bin/yt-dlp-webui_linux-amd64 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o release-bin/yt-dlp-webui_linux-arm64 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o release-bin/yt-dlp-webui_linux-armv7 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=6 go build -ldflags="-s -w" -o release-bin/yt-dlp-webui_linux-armv6 main.go
          ls -lh release-bin/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.0.1-rc1') }}
          files: release-bin/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag_name, '-rc') || contains(github.ref_name, '-rc') || contains(inputs.tag_name, '-beta') || contains(github.ref_name, '-beta') || true }}
